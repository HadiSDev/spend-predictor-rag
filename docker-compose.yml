services:
  mock-erp-api:
    build:
      context: apps/mock-erp
    ports:
      - "8000:8000"
    environment:
      MOCK_ERP_SEED: "42"
      MOCK_ERP_MONTHS: "12"
      MOCK_ERP_AVG_INVOICES: "15"
      MOCK_ERP_START_DATE: "2025-07-01"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: spend_predictor
      POSTGRES_USER: spend_predictor
      POSTGRES_PASSWORD: spend_predictor
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
