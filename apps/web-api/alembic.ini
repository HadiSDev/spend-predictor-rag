# Alembic configuration for the spend-predictor procurement DB.
# Run from the repository root with:
#   uv run alembic -c apps/web-api/alembic.ini upgrade head
# (reads DATABASE_URL via env.py; web_api is importable from the workspace venv).
[alembic]
script_location = %(here)s/src/web_api/db/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
