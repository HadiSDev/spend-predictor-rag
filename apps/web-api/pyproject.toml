[project]
name = "web-api"
version = "0.2.0"
description = "Business domain + customer API: ORM, ERP connectors, Clerk-authenticated FastAPI, dashboard"
requires-python = ">=3.12,<3.13"
# Never `ai-api`: the domain is imported by the AI workflows, not the reverse.
dependencies = [
    "alembic>=1.13.0",
    "cryptography>=48.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.12.5",
    "pyjwt[crypto]>=2.9.0",
    "python-dotenv>=1.2.2",
    "regex>=2026.1.15",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.22",
    "streamlit>=1.30.0",
    "svix>=1.96.1",
    "uvicorn[standard]>=0.30.0",
]

# The connector tests drive the mock ERP in-process.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mock-erp",
]

[tool.uv.sources]
mock-erp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
