[project]
name = "mock-erp"
version = "0.2.0"
description = "Standalone mock ERP API server with deterministic synthetic ledger data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "uvicorn[standard]>=0.30.0",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
